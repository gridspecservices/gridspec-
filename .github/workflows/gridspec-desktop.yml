name: Build GridSpec Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "gridspec-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64 installer
            script: build:win
            artifact: gridspec-windows-x64
          - os: macos-latest
            label: Universal Mac installer
            script: build:mac
            artifact: gridspec-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm --filter @workspace/gridspec-desktop run ${{ matrix.script }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/gridspec/release/*
          if-no-files-found: error
          retention-days: 14
