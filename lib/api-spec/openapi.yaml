openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /workspace:
    get:
      operationId: getWorkspace
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
  /summary:
    get:
      operationId: getSummary
      responses:
        "200":
          description: Analytics computed from workspace records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
  /projects:
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /assets/{id}:
    patch:
      operationId: updateAsset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
  /work-orders:
    post:
      operationId: createWorkOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkOrderInput" }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
  /demo:
    post:
      operationId: loadDemo
      responses:
        "200":
          description: Add fictional demo data idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ProjectInput:
      type: object
      required: [name, utility, circuit]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        utility: { type: string, minLength: 1, maxLength: 100 }
        circuit: { type: string, minLength: 1, maxLength: 100 }
    Project:
      allOf:
        - { $ref: "#/components/schemas/ProjectInput" }
        - type: object
          required: [id, status, date, demo]
          properties:
            id: { type: string }
            status: { type: string }
            date: { type: string }
            demo: { type: boolean }
    Severity:
      type: string
      enum: [Critical, High, Medium, Low]
    OrderStatus:
      type: string
      enum: [Draft, Needs Review, Approved, Assigned, Completed]
    Photo:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
    AssetInput:
      type: object
      required: [structureId, circuit, inspectionDate, defectType, severity, confidence, notes]
      properties:
        structureId: { type: string, minLength: 1, maxLength: 100 }
        circuit: { type: string, minLength: 1 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        inspectionDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        defectType: { type: string, minLength: 1, maxLength: 100 }
        severity: { $ref: "#/components/schemas/Severity" }
        confidence: { type: number, minimum: 0, maximum: 100 }
        notes: { type: string, maxLength: 5000 }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
    Asset:
      allOf:
        - { $ref: "#/components/schemas/AssetInput" }
        - type: object
          required: [id, projectId, utility, reviewed, demo, photos]
          properties:
            id: { type: string }
            projectId: { type: string }
            utility: { type: string }
            reviewed: { type: boolean }
            demo: { type: boolean }
            photos:
              type: array
              items: { $ref: "#/components/schemas/Photo" }
    AssetUpdate:
      type: object
      properties:
        notes: { type: string, maxLength: 5000 }
        severity: { $ref: "#/components/schemas/Severity" }
        defectType: { type: string, minLength: 1 }
        reviewed: { type: boolean }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
    WorkOrderInput:
      type: object
      required: [assetId, issue, priority, crew]
      properties:
        assetId: { type: string }
        issue: { type: string, minLength: 1, maxLength: 5000 }
        priority: { $ref: "#/components/schemas/Severity" }
        crew: { type: string, minLength: 1, maxLength: 200 }
    WorkOrder:
      allOf:
        - { $ref: "#/components/schemas/WorkOrderInput" }
        - type: object
          required: [id, status, createdAt, reviewer]
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/OrderStatus" }
            createdAt: { type: string }
            reviewer: { type: string }
    AuditEntry:
      type: object
      required: [id, time, entityId, action, actor]
      properties:
        id: { type: string }
        time: { type: string }
        entityId: { type: string }
        action: { type: string }
        actor: { type: string }
    Workspace:
      type: object
      required: [projects, assets, workOrders, audit]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        assets:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        workOrders:
          type: array
          items: { $ref: "#/components/schemas/WorkOrder" }
        audit:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
    Count:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    Summary:
      type: object
      required: [totalAssets, totalProjects, criticalFindings, openWorkOrders, reviewed, byType, bySeverity, byCircuit, trend]
      properties:
        totalAssets: { type: integer }
        totalProjects: { type: integer }
        criticalFindings: { type: integer }
        openWorkOrders: { type: integer }
        reviewed: { type: integer }
        byType: { type: array, items: { $ref: "#/components/schemas/Count" } }
        bySeverity: { type: array, items: { $ref: "#/components/schemas/Count" } }
        byCircuit: { type: array, items: { $ref: "#/components/schemas/Count" } }
        trend: { type: array, items: { $ref: "#/components/schemas/Count" } }
