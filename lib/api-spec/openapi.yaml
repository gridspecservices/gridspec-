openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /workspace:
    get:
      operationId: getWorkspace
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
  /summary:
    get:
      operationId: getSummary
      responses:
        "200":
          description: Analytics computed from workspace records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
  /projects:
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /assets/{id}:
    patch:
      operationId: updateAsset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
  /assets/{id}/photos:
    post:
      operationId: createAssetPhoto
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetPhotoInput" }
      responses:
        "201":
          description: Photo metadata saved for the asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
  /storage/uploads/request-url:
    post:
      operationId: requestPhotoUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Presigned upload URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      parameters:
        - { name: objectPath, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Private uploaded image content.
          content:
            image/*:
              schema: { type: string, format: binary }
        "401": { description: Sign-in required. }
        "404": { description: Image not found. }
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Current authentication state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
  /login:
    get:
      operationId: beginBrowserLogin
      parameters:
        - { name: returnTo, in: query, required: false, schema: { type: string } }
      responses:
        "302": { description: Redirect to the identity provider. }
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      responses:
        "302": { description: Redirect to the application after login. }
  /logout:
    get:
      operationId: logoutBrowserSession
      parameters:
        - { name: returnTo, in: query, required: false, schema: { type: string } }
      responses:
        "302": { description: Redirect to the identity provider logout. }
  /work-orders:
    post:
      operationId: createWorkOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkOrderInput" }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
  /work-orders/{id}:
    patch:
      operationId: updateWorkOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkOrderTransition" }
      responses:
        "200":
          description: Work order moved to the next lifecycle state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkOrder" }
        "400": { description: Invalid lifecycle transition. }
        "404": { description: Work order not found. }
  /demo:
    post:
      operationId: loadDemo
      responses:
        "200":
          description: Add fictional demo data idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ProjectInput:
      type: object
      required: [name, utility, circuit]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        utility: { type: string, minLength: 1, maxLength: 100 }
        circuit: { type: string, minLength: 1, maxLength: 100 }
    Project:
      allOf:
        - { $ref: "#/components/schemas/ProjectInput" }
        - type: object
          required: [id, status, date, demo]
          properties:
            id: { type: string }
            status: { type: string }
            date: { type: string }
            demo: { type: boolean }
    Severity:
      type: string
      enum: [Critical, High, Medium, Low]
    OrderStatus:
      type: string
      enum: [Draft, Needs Review, Approved, Assigned, Completed]
    Photo:
      type: object
      required: [name, url]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        objectPath: { type: string }
        contentType: { type: string }
        size: { type: integer }
        createdAt: { type: string }
    AssetPhotoInput:
      type: object
      required: [objectPath, name, size, contentType]
      properties:
        objectPath: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 26214400 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 26214400 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata: { $ref: "#/components/schemas/UploadUrlRequest" }
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, "null"], format: email }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - { $ref: "#/components/schemas/AuthUser" }
            - { type: "null" }
    AssetInput:
      type: object
      required: [structureId, circuit, inspectionDate, defectType, severity, confidence, notes]
      properties:
        structureId: { type: string, minLength: 1, maxLength: 100 }
        circuit: { type: string, minLength: 1 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        inspectionDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        defectType: { type: string, minLength: 1, maxLength: 100 }
        severity: { $ref: "#/components/schemas/Severity" }
        confidence: { type: number, minimum: 0, maximum: 100 }
        notes: { type: string, maxLength: 5000 }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
    Asset:
      allOf:
        - { $ref: "#/components/schemas/AssetInput" }
        - type: object
          required: [id, projectId, utility, reviewed, demo, photos]
          properties:
            id: { type: string }
            projectId: { type: string }
            utility: { type: string }
            reviewed: { type: boolean }
            demo: { type: boolean }
            photos:
              type: array
              items: { $ref: "#/components/schemas/Photo" }
    AssetUpdate:
      type: object
      properties:
        notes: { type: string, maxLength: 5000 }
        severity: { $ref: "#/components/schemas/Severity" }
        defectType: { type: string, minLength: 1 }
        reviewed: { type: boolean }
        photos:
          type: array
          items: { $ref: "#/components/schemas/Photo" }
    WorkOrderInput:
      type: object
      required: [assetId, issue, priority]
      properties:
        assetId: { type: string }
        issue: { type: string, minLength: 1, maxLength: 5000 }
        priority: { $ref: "#/components/schemas/Severity" }
        crew: { type: string, minLength: 1, maxLength: 200 }
    WorkOrderTransition:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
        crew: { type: string, minLength: 1, maxLength: 200 }
    WorkOrder:
      allOf:
        - { $ref: "#/components/schemas/WorkOrderInput" }
        - type: object
          required: [id, status, createdAt, reviewer, crew]
          properties:
            id: { type: string }
            status: { $ref: "#/components/schemas/OrderStatus" }
            crew: { type: string, minLength: 1, maxLength: 200 }
            createdAt: { type: string }
            reviewer: { type: string }
    AuditEntry:
      type: object
      required: [id, time, entityId, action, actor]
      properties:
        id: { type: string }
        time: { type: string }
        entityId: { type: string }
        action: { type: string }
        actor: { type: string }
    Workspace:
      type: object
      required: [projects, assets, workOrders, audit]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        assets:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        workOrders:
          type: array
          items: { $ref: "#/components/schemas/WorkOrder" }
        audit:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
    Count:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    Summary:
      type: object
      required: [totalAssets, totalProjects, criticalFindings, openWorkOrders, reviewed, byType, bySeverity, byCircuit, trend]
      properties:
        totalAssets: { type: integer }
        totalProjects: { type: integer }
        criticalFindings: { type: integer }
        openWorkOrders: { type: integer }
        reviewed: { type: integer }
        byType: { type: array, items: { $ref: "#/components/schemas/Count" } }
        bySeverity: { type: array, items: { $ref: "#/components/schemas/Count" } }
        byCircuit: { type: array, items: { $ref: "#/components/schemas/Count" } }
        trend: { type: array, items: { $ref: "#/components/schemas/Count" } }
