<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>GridSpec — Connection unavailable</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #203541;
        background: #f1f5f4;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 480px);
        padding: 36px;
        background: #fff;
        border: 1px solid #dce5e3;
        border-radius: 14px;
        box-shadow: 0 18px 55px rgb(23 44 55 / 8%);
      }
      .mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        color: #172c37;
        background: #63c8a8;
        border-radius: 12px;
      }
      .eyebrow {
        margin: 28px 0 10px;
        color: #287d69;
        font: 700 11px ui-monospace, monospace;
        letter-spacing: .12em;
      }
      h1 { margin: 0; font-size: 27px; letter-spacing: -.04em; }
      p { color: #687d83; line-height: 1.65; font-size: 14px; }
      button {
        min-height: 42px;
        margin-top: 10px;
        padding: 0 17px;
        border: 0;
        border-radius: 7px;
        color: #fff;
        background: #247e69;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #1d6c5a; }
      button:focus-visible { outline: 3px solid #63c8a8; outline-offset: 3px; }
      @media (max-width: 500px) { main { padding: 26px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none">
          <path d="M13.4 2.8 5.8 13h5.3l-.5 8.2L18.2 11h-5.4l.6-8.2Z" fill="currentColor" />
        </svg>
      </div>
      <p class="eyebrow">GRIDSPEC WORKSPACE</p>
      <h1>Can’t reach the inspection workspace.</h1>
      <p>Check your internet connection, then try again. Your inspection data remains in the online workspace.</p>
      <button type="button" onclick="window.location.href = 'https://handy-darkcyan-softwaresuite.replit.app'">Try again</button>
    </main>
  </body>
</html>
